

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pocket Waffle | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{--bg:#100e0c;--panel:#1d1915;--gold:#e9ae53;--text:#fff8ed;--muted:#aaa096;--red:#e45d55}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}

button,input,select,textarea{font:inherit}

button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}

.primary{background:var(--gold);color:#21170b}

.secondary{background:#393027;color:white}

.danger{background:#572724;color:#fff}

.wrap{max-width:1100px;margin:auto;padding:20px}

header{display:flex;align-items:center;gap:12px;margin-bottom:25px}

header img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:white}

h1{font-size:22px;margin:0}

small,.muted{color:var(--muted)}

.panel{background:var(--panel);border:1px solid #393027;border-radius:16px;padding:20px;margin-bottom:18px}

input,select,textarea{width:100%;padding:13px;background:#110f0d;color:white;border:1px solid #514438;border-radius:9px;margin:7px 0 14px}

label{font-size:13px;color:#d8c9b7}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.actions{display:flex;gap:8px;flex-wrap:wrap}

.product{display:flex;gap:13px;align-items:center;border-bottom:1px solid #393027;padding:13px 0}

.product img{width:68px;height:68px;object-fit:cover;border-radius:10px;background:#333}

.product-info{flex:1;min-width:0}

.product-info strong{display:block;overflow-wrap:anywhere}

.product-info small{display:block;margin-top:5px}

.hidden{display:none!important}

#message{padding:12px;border-radius:9px;margin:12px 0;display:none;white-space:pre-wrap}

#message.ok{display:block;background:#173c2a;color:#b9f4cf}

#message.err{display:block;background:#4b2421;color:#ffd0c9}

.preview{width:100px;height:100px;object-fit:cover;border-radius:12px;display:none}

.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

h2{font-size:18px;margin:0 0 15px}

@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:15px}.product{align-items:flex-start}}

</style>

</head>

<body>

<div class="wrap">

<header>

<img src="IMG_9189.jpeg" alt="Pocket Waffle logo"

onerror="this.style.display='none'">

<div>

<h1>POCKET WAFFLE</h1>

<small>Owner Admin Dashboard</small>

</div>

</header>

<div id="message"></div>

<section id="login" class="panel">

<h2>Owner Login</h2>

<label>Email</label>

<input id="email" type="email" placeholder="Owner email">

<label>Password</label>

<input id="password" type="password" placeholder="Password">

<button class="primary" id="loginBtn">Login securely</button>

<p class="muted">Only an authorized owner account can access this dashboard.</p>

</section>

<section id="dashboard" class="hidden">

<div class="topline panel">

<div>

<h2>Dashboard</h2>

<small id="welcome">Manage your menu</small>

</div>

<button class="secondary" id="logoutBtn">Logout</button>

</div>

<div class="panel">

<h2 id="formTitle">Add New Product</h2>

<form id="productForm">

<input type="hidden" id="productId">

<div class="grid">

<div>

<label>Product name *</label>

<input id="name" required maxlength="120" placeholder="Product name">

</div>

<div>

<label>Category *</label>

<select id="category" required>

<option value="">Select category</option>

</select>

</div>

</div>

<div class="grid">

<div>

<label>Price (₹) *</label>

<input id="price" type="number" min="0" step="0.01" required placeholder="Price">

</div>

<div>

<label>Display order</label>

<input id="sortOrder" type="number" value="0">

</div>

</div>

<label>Description</label>

<textarea id="description" rows="2" maxlength="500" placeholder="Short product description"></textarea>

<label>Product photo</label>

<input id="photo" type="file" accept="image/*">

<img id="preview" class="preview" alt="Image preview">

<label style="display:flex;gap:9px;align-items:center;margin:12px 0">

<input id="available" type="checkbox" checked style="width:auto;margin:0">

Available for sale

</label>

<div class="actions">

<button class="primary" type="submit" id="saveBtn">Save Product</button>

<button class="secondary" type="button" id="cancelBtn">Clear</button>

</div>

</form>

</div>

<div class="panel">

<h2>Manage Categories</h2>

<form id="categoryForm" class="grid">

<div>

<label>New category name</label>

<input id="categoryName" required maxlength="80" placeholder="e.g. Waffles">

</div>

<div style="display:flex;align-items:end">

<button class="primary" type="submit">Add Category</button>

</div>

</form>

<div id="categoryList"></div>

</div>

<div class="panel">

<div class="topline">

<h2>Menu Products</h2>

<small id="productCount">Loading...</small>

</div>

<input id="search" placeholder="Search products...">

<div id="productList">Loading products...</div>

</div>

</section>

</div>

<script>

/* Keep your existing Supabase Project URL and Publishable Key here. */

const SUPABASE_URL = "https://wufdshumwrkdtgncsmpm.supabase.co/rest/v1/";

const SUPABASE_KEY = "sb_publishable_y41lr9xEl9zyl-B7EBWdZqA_iybBlvOF";

const BUCKET = "product-images";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let categories = [];

let products = [];

function message(text, type="ok") {

  $("message").textContent = text;

  $("message").className = type;

  $("message").style.display = "block";

  window.scrollTo({top:0,behavior:"smooth"});

}

function clearMessage() {

  $("message").style.display = "none";

}

function escapeHTML(value="") {

  return String(value).replace(/[&<>"']/g, c => ({

    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

  }[c]));

}

function money(value) {

  return "₹" + Number(value || 0).toLocaleString("en-IN");

}

async function verifyAdmin() {

  const {data:{session}} = await db.auth.getSession();

  if (!session) {

    $("login").classList.remove("hidden");

    $("dashboard").classList.add("hidden");

    return false;

  }

  const {data,error} = await db.rpc("is_admin");

  if (error || data !== true) {

    await db.auth.signOut();

    $("login").classList.remove("hidden");

    $("dashboard").classList.add("hidden");

    message("This account is not authorized as an admin.", "err");

    return false;

  }

  $("login").classList.add("hidden");

  $("dashboard").classList.remove("hidden");

  $("welcome").textContent = session.user.email;

  await loadAll();

  return true;

}

$("loginBtn").addEventListener("click", async () => {

  clearMessage();

  const email = $("email").value.trim();

  const password = $("password").value;

  if (!email || !password) return message("Enter email and password.", "err");

  $("loginBtn").disabled = true;

  $("loginBtn").textContent = "Logging in...";

  const {error} = await db.auth.signInWithPassword({email,password});

  $("loginBtn").disabled = false;

  $("loginBtn").textContent = "Login securely";

  if (error) return message(error.message, "err");

  await verifyAdmin();

});

$("logoutBtn").addEventListener("click", async () => {

  await db.auth.signOut();

  $("dashboard").classList.add("hidden");

  $("login").classList.remove("hidden");

  message("You have been logged out.");

});

db.auth.onAuthStateChange((_event, session) => {

  if (!session) {

    $("dashboard").classList.add("hidden");

    $("login").classList.remove("hidden");

  }

});

async function loadAll() {

  await Promise.all([loadCategories(),loadProducts()]);

}

async function loadCategories() {

  const {data,error} = await db.from("categories")

    .select("*").order("sort_order").order("name");

  if (error) return message("Categories: " + error.message,"err");

  categories = data || [];

  $("category").innerHTML = '<option value="">Select category</option>' +

    categories.map(c => `<option value="${c.id}">${escapeHTML(c.name)}</option>`).join("");

  $("categoryList").innerHTML = categories.map(c => `

    <div class="product">

      <div class="product-info"><strong>${escapeHTML(c.name)}</strong></div>

      <button class="danger" onclick="deleteCategory('${c.id}')">Delete</button>

    </div>`).join("") || '<small>No categories yet.</small>';

}

async function loadProducts() {

  const {data,error} = await db.from("menu_items")

    .select("*, categories(name)")

    .order("sort_order").order("name");

  if (error) return message("Products: " + error.message,"err");

  products = data || [];

  renderProducts();

}

function renderProducts() {

  const q = $("search").value.toLowerCase().trim();

  const filtered = products.filter(p =>

    (p.name || "").toLowerCase().includes(q) ||

    (p.categories?.name || "").toLowerCase().includes(q)

  );

  $("productCount").textContent = `${filtered.length} products`;

  $("productList").innerHTML = filtered.map(p => `

    <div class="product">

      ${p.image_url ? `<img src="${escapeHTML(p.image_url)}" alt="">` : `<img alt="No image">`}

      <div class="product-info">

        <strong>${escapeHTML(p.name)}</strong>

        <small>${escapeHTML(p.categories?.name || "No category")} · ${money(p.price)}</small>

        <small>${p.is_available ? "Available" : "Sold out"}</small>

      </div>

      <div class="actions">

        <button class="secondary" onclick="editProduct('${p.id}')">Edit</button>

        <button class="secondary" onclick="toggleAvailability('${p.id}',${!p.is_available})">${p.is_available ? "Sold out" : "Available"}</button>

        <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button>

      </div>

    </div>`).join("") || '<small>No products found.</small>';

}

$("search").addEventListener("input",renderProducts);

$("categoryForm").addEventListener("submit",async e => {

  e.preventDefault();

  const name = $("categoryName").value.trim();

  if (!name) return;

  const {error} = await db.from("categories").insert({name,sort_order:categories.length});

  if (error) return message(error.message,"err");

  $("categoryName").value = "";

  message("Category added.");

  await loadCategories();

});

async function deleteCategory(id) {

  if (!confirm("Delete this category? Categories assigned to products may be protected by the database.")) return;

  const {error} = await db.from("categories").delete().eq("id",id);

  if (error) return message(error.message,"err");

  message("Category deleted.");

  await loadCategories();

  await loadProducts();

}

$("photo").addEventListener("change",() => {

  const file = $("photo").files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    $("photo").value = "";

    return message("Please choose an image file.","err");

  }

  if (file.size > 5*1024*1024) {

    $("photo").value = "";

    return message("Image must be smaller than 5 MB.","err");

  }

  $("preview").src = URL.createObjectURL(file);

  $("preview").style.display = "block";

});

async function uploadPhoto(file) {

  const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g,"");

  const path = `${crypto.randomUUID()}.${ext}`;

  const {error} = await db.storage.from(BUCKET).upload(path,file,{

    cacheControl:"3600",upsert:false,contentType:file.type

  });

  if (error) throw error;

  const {data} = db.storage.from(BUCKET).getPublicUrl(path);

  return data.publicUrl;

}

$("productForm").addEventListener("submit",async e => {

  e.preventDefault();

  clearMessage();

  const id = $("productId").value;

  const file = $("photo").files[0];

  $("saveBtn").disabled = true;

  $("saveBtn").textContent = "Saving...";

  try {

    let image_url = id ? products.find(p => p.id === id)?.image_url || null : null;

    if (file) image_url = await uploadPhoto(file);

    const item = {

      name:$("name").value.trim(),

      category_id:$("category").value,

      price:Number($("price").value),

      description:$("description").value.trim(),

      image_url,

      is_available:$("available").checked,

      sort_order:Number($("sortOrder").value || 0)

    };

    if (!item.name || !item.category_id || !Number.isFinite(item.price) || item.price < 0) {

      throw new Error("Enter a valid name, category and price.");

    }

    const result = id

      ? await db.from("menu_items").update(item).eq("id",id)

      : await db.from("menu_items").insert(item);

    if (result.error) throw result.error;

    resetForm();

    message(id ? "Product updated." : "Product added.");

    await loadProducts();

  } catch(err) {

    message(err.message || "Could not save product.","err");

  } finally {

    $("saveBtn").disabled = false;

    $("saveBtn").textContent = "Save Product";

  }

});

function editProduct(id) {

  const p = products.find(x => x.id === id);

  if (!p) return;

  $("productId").value = p.id;

  $("name").value = p.name || "";

  $("category").value = p.category_id || "";

  $("price").value = p.price;

  $("description").value = p.description || "";

  $("sortOrder").value = p.sort_order || 0;

  $("available").checked = !!p.is_available;

  $("preview").src = p.image_url || "";

  $("preview").style.display = p.image_url ? "block" : "none";

  $("photo").value = "";

  $("formTitle").textContent = "Edit Product";

  $("saveBtn").textContent = "Update Product";

  window.scrollTo({top:0,behavior:"smooth"});

}

function resetForm() {

  $("productForm").reset();

  $("productId").value = "";

  $("available").checked = true;

  $("sortOrder").value = 0;

  $("preview").style.display = "none";

  $("preview").src = "";

  $("formTitle").textContent = "Add New Product";

  $("saveBtn").textContent = "Save Product";

}

$("cancelBtn").addEventListener("click",resetForm);

async function toggleAvailability(id,value) {

  const {error} = await db.from("menu_items")

    .update({is_available:value}).eq("id",id);

  if (error) return message(error.message,"err");

  message(value ? "Product marked available." : "Product marked sold out.");

  await loadProducts();

}

async function deleteProduct(id) {

  if (!confirm("Permanently delete this product?")) return;

  const {error} = await db.from("menu_items").delete().eq("id",id);

  if (error) return message(error.message,"err");

  message("Product deleted.");

  await loadProducts();

}

verifyAdmin();

</script>

</body>

</html>
